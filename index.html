<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Octobase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --teal: #3DBFAA;
      --teal-dark: #2a9e8c;
      --teal-light: #5dd4bf;
      --white: #ffffff;
      --overlay: rgba(0,0,0,0.45);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      background: #0d1a18;
    }

    /* ── VIDEO BACKGROUND ── */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .video-bg video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--overlay);
    }

    /* ── LOGO (ثابت في الزاوية) ── */
    .logo-wrap {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 10;
      animation: fadeDown 1s ease both;
    }
    .logo-wrap img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      filter: brightness(1.2);
    }

    /* ── LAYOUT ── */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── CENTER CONTENT ── */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      animation: fadeUp 1.1s ease 0.2s both;
      flex: 1;
      justify-content: center;
    }

    .center h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.8rem, 8vw, 6rem);
      color: var(--teal-light);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .center p {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      color: rgba(255,255,255,0.65);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    /* ── BOTTOM ── */
    .bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1.5rem;
      animation: fadeUp 1.2s ease 0.5s both;
      width: 100%;
    }

    .contact-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.7rem 1.4rem;
      border-radius: 100px;
      text-decoration: none;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      border: 2px solid transparent;
    }

    .btn-whatsapp {
      background: var(--teal);
      color: #fff;
      border-color: var(--teal);
    }
    .btn-whatsapp:hover {
      background: var(--teal-light);
      border-color: var(--teal-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(61,191,170,0.45);
    }

    .btn-twitter {
      background: transparent;
      color: #fff;
      border-color: rgba(255,255,255,0.4);
    }
    .btn-twitter:hover {
      background: rgba(255,255,255,0.1);
      border-color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255,255,255,0.15);
    }

    .icon { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    .bottom-bar {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .logo-wrap img { width: 50px; height: 50px; }
      .contact-btn { padding: 0.6rem 1rem; font-size: 0.88rem; }
    }
  </style>
</head>
<body>

  <!-- VIDEO -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="intro.mp4" type="video/mp4">
    </video>
  </div>

  <!-- LOGO -->
  <div class="logo-wrap">
    <img src="octobase-02-removebg-preview.png" alt="Octobase Logo">
  </div>

  <!-- PAGE -->
  <div class="page">

    <!-- CENTER -->
    <div class="center">
      <h1>Octobase</h1>
      <p>محيط مختلف</p>
    </div>

    <!-- BOTTOM -->
    <div class="bottom">
      <div class="contact-row">
        <a class="contact-btn btn-whatsapp" href="https://wa.me/966565593331" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24">

          </svg>
          واتساب

        <a class="contact-btn btn-twitter" href="https://twitter.com/octobase_sa" target="_blank" rel="noopener">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.748l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          @octobase_sa
        </a>
      </div>
      <div class="bottom-bar">© 2026 Octobase · جميع الحقوق محفوظة</div>
    </div>

  </div>

</body>
</html>
